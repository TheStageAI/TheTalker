# Qwen3-TTS 0.6B-Base -- optimized (documented serving-parameter changes on
# top of the stock vllm-omni config; no code changes).
#
# Same speech tokenizer/decoder as the 1.7B checkpoint, so the connector
# settings here are the same shape as qwen3tts17b_optimized.yaml; only the
# served model name differs (chosen on the `vllm serve` command line).
base_config: qwen3tts06b_default.yaml

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 75
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 16
      decode_batch_max_size: 4
      ref_code_context_frames: 72
      decode_cudagraph_capture_sizes: [74, 91, 109, 128, 149, 170, 190, 205, 325]
